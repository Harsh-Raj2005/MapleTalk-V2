# Test-only datasource. These tests run against H2 in MySQL-compatibility
# mode, NOT against real MySQL. They verify JPA mapping/constraint behavior,
# not actual MySQL persistence — see the Phase 2 report for what was
# separately verified against a live local MySQL instance.
spring.datasource.url=jdbc:h2:mem:mapletalk_test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# Fixed test-only JWT secret — not a production credential, never used outside
# the test H2 profile.
security.jwt.secret=test-only-dev-secret-key-not-for-production-use-0123456789
security.jwt.expiration-ms=3600000

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
