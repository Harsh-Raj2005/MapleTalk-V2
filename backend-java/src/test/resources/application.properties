# Test-only datasource. These tests run against H2 in MySQL-compatibility
# mode, NOT against real MySQL. They verify JPA mapping/constraint behavior,
# not actual MySQL persistence — see the Phase 2 report for what was
# separately verified against a live local MySQL instance.
spring.datasource.url=jdbc:h2:mem:mapletalk_test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# Fixed test-only JWT secret — not a production credential, never used outside
# the test H2 profile.
security.jwt.secret=test-only-dev-secret-key-not-for-production-use-0123456789
security.jwt.expiration-ms=3600000

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

cors.allowed-origins=http://localhost:5173

# Fixed test-only Stream secret — not a production credential.
stream.api.secret=test-only-dev-stream-secret-not-for-production-use-0123456789
stream.api.key=test-only-fake-key

# Kafka disabled entirely for tests — no real Aiven connection is attempted.
# Values below are placeholders only, never dialed since kafka.enabled=false
# means the producer/consumer beans are never created.
kafka.enabled=false
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.security.protocol=PLAINTEXT
