spring.application.name=mapletalk-backend
server.port=8080

# Database connection — always sourced from environment variables.
# The default host/port/db-name/username are conventional local-dev placeholders,
# not credentials. DB_PASSWORD has no default, so a real password must always be
# supplied via environment for the app to connect.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mapletalk_v2?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ddl-auto=update is a local-development convenience only. It is NOT a migration
# strategy and must never be relied on for production schema changes — a real
# migration tool (Flyway/Liquibase) would own schema changes in production.
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.show-sql=${DB_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT signing secret — required, no fallback default. Must be a Base64 or raw
# UTF-8 string of at least 32 bytes (HS256 minimum key length). Never commit a
# real value; supply it via the JWT_SECRET environment variable.
security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# JwtAuthFilter populates SecurityContext directly and never goes through an
# AuthenticationManager/UserDetailsService, so Spring Boot's default in-memory
# user (and its "Using generated security password" log line) is dead weight
# here, not a real credential. Disabling the auto-configuration that creates
# it — a real UserDetailsService backed by UserRepository is Phase 5's job.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# CORS — comma-separated list of allowed frontend origins. The local-dev
# default matches Vite's default port; override via CORS_ALLOWED_ORIGINS for
# any other environment (never a wildcard).
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Stream Chat/Video signing secret — required, no fallback default. Never
# logged, never returned in any response. Only the secret is needed
# server-side: the public API key already lives in the frontend's own env
# (VITE_STREAM_API_KEY), and token signing needs nothing else.
stream.api.secret=${STREAM_API_SECRET}
stream.api.key=${STREAM_API_KEY}

# Aiven Kafka. kafka.enabled gates whether the producer/consumer beans are
# created at all (see FriendshipEventProducer/Consumer) — disabled in the
# test profile so the existing test suite never attempts a real network
# connection. KAFKA_PASSWORD and KAFKA_CA_CERTIFICATE have no default and are
# never logged; the CA certificate is supplied as raw PEM text via env var,
# not a file, so nothing certificate-related ever touches the repository.
kafka.enabled=${KAFKA_ENABLED:true}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}
spring.kafka.security.protocol=SASL_SSL
spring.kafka.properties.sasl.mechanism=SCRAM-SHA-256
spring.kafka.properties.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="${KAFKA_USERNAME}" password="${KAFKA_PASSWORD}";
spring.kafka.ssl.trust-store-type=PEM
spring.kafka.ssl.trust-store-certificates=${KAFKA_CA_CERTIFICATE}

spring.kafka.consumer.group-id=mapletalk-backend
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.mapletalk.kafka
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
